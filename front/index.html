    <link rel="icon" type="image/webp" href="imagenes/faviconpagina.webp">

    <style>
        /* Animacion de fondo: estrellas reemplazadas por herramientas flotantes.
           El canvas #galaxy se conserva (script.js lo necesita para el click) pero
           se oculta. La animacion va en CSS porque la CSP del servidor prohibe JS inline. */
        #galaxy { display: none; }
        .tools {
            position: absolute;
            inset: 0;
            z-index: 1;
            overflow: hidden;
            pointer-events: none;
        }
        .tools .tool {
            position: absolute;
            transform-origin: center;
            will-change: transform;
            animation-iteration-count: infinite;
            animation-timing-function: ease-in-out;
        }
        @keyframes float-a {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            50%      { transform: translate(10px, -16px) rotate(8deg); }
        }
        @keyframes float-b {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            50%      { transform: translate(-12px, -12px) rotate(-9deg); }
        }
        @keyframes float-c {
            0%, 100% { transform: translate(0, 0) rotate(-5deg); }
            50%      { transform: translate(8px, -20px) rotate(6deg); }
        }
        @media (prefers-reduced-motion: reduce) {
            .tools .tool { animation: none !important; }
        }
    </style>
</head>
